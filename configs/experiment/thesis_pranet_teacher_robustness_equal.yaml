# @package _global_

defaults:
  - /model: pranet
  - /crisp: default
  - /teacher_pool: thesis_robustness
  - /data@source_data: thesis_train_test
  - /eval: metrics
  - _self_

protocol_profile: current_crisp
experiment_name: thesis_pranet_teacher_robustness_equal
task: binary_polyp_segmentation
seed: 2026
seeds: [2026, 2027, 2028, 2029, 2030]
output_dir: outputs/checkpoints/${experiment_name}/seed_${seed}
eval_output_dir: outputs/metrics/${experiment_name}/seed_${seed}
eval_datasets: [Kvasir-SEG, CVC-ClinicDB, CVC-300, CVC-ColonDB, ETIS]

benchmark:
  train_split: "fixed explicit source membership is required"
  eval_split: "Kvasir-SEG, CVC-ClinicDB, CVC-300, CVC-ColonDB, ETIS"

source_data:
  local_split: null
  source_split:
    mode: manifest
    count_profile: current_crisp
    train_manifest: null
    val_manifest: null

training:
  total_epochs: 120
  epochs: ${training.total_epochs}
  phases:
    baseline_warmup: 25
    crisp_full: 65
    finetune: 30
    phase2_ramp_epochs: 10
  batch_size: 12
  require_validation: true
  optimizer: adamw
  lr_student: 1.0e-4
  lr_projector: 5.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  mixed_precision: true
  gradient_clip_norm: 1.0

method:
  name: crisp
  use_crisp: true
  use_projector: true
  use_teachers: true
  target_mode: boundary_posterior
  use_boundary_weighted_task: true
  use_identity_regularization: true
  use_amortization_loss: true
  allow_self_ensemble_teacher: false

eval:
  auto_discover_local_test_datasets: true
  membership_count_profile: current_crisp

crisp:
  teacher:
    teacher_names: [uacanet_l, polyp_pvt, sammamba]
    robustness:
      enabled: true
      degraded_teacher: sammamba
      distribution: gaussian
      logit_noise_std: 1.0
      seed_keys: [seed, dataset_name, image_id]
      aggregation: equal_average
