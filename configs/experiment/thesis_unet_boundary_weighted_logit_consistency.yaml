# @package _global_

defaults:
  - /model: unet
  - /data@source_data: thesis_train_test
  - /eval: metrics
  - _self_

protocol_profile: current_crisp
experiment_name: thesis_unet_boundary_weighted_logit_consistency
task: binary_polyp_segmentation
seed: 2026
seeds: [2026, 2027, 2028, 2029, 2030]
output_dir: outputs/checkpoints/${experiment_name}/seed_${seed}
eval_output_dir: outputs/metrics/${experiment_name}/seed_${seed}
eval_datasets: [Kvasir-SEG, CVC-ClinicDB, CVC-300, CVC-ColonDB, ETIS]

benchmark:
  train_split: "fixed explicit source membership is required"
  eval_split: "Kvasir-SEG, CVC-ClinicDB, CVC-300, CVC-ColonDB, ETIS"

source_data:
  local_split: null
  source_split:
    mode: manifest
    count_profile: current_crisp
    train_manifest: null
    val_manifest: null

training:
  total_epochs: 120
  epochs: ${training.total_epochs}
  phases:
    baseline_warmup: 25
    crisp_full: 65
    finetune: 30
    phase2_ramp_epochs: 10
  batch_size: 16
  require_validation: true
  optimizer: adamw
  lr_student: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  mixed_precision: true
  gradient_clip_norm: 1.0

method:
  name: boundary_weighted_logit_consistency
  use_crisp: false
  use_projector: false
  use_teachers: false

calibration_control:
  name: boundary_weighted_logit_consistency
  lambda_min: 0.01
  lambda_max: 1.0
  radius: 10.0
  alpha: 1.0
  boundary_weighting: native_linear
  view_geometry: independent_inverse_aligned
  consistency_signal: raw_final_logit

eval:
  auto_discover_local_test_datasets: true
  membership_count_profile: current_crisp
