name: CI

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run CPU-safe scientific and protocol gates
        run: >-
          python -m pytest -q
          tests/test_protocol_guard.py
          tests/test_source_manifest.py
          tests/test_evaluation_membership.py
          tests/test_posthoc_calibration.py
          tests/test_locked_training_values.py
          tests/test_boundary.py
          tests/test_solver.py
          tests/test_losses.py
          tests/test_metrics.py
          tests/test_projector_head.py
          tests/test_public_release.py
